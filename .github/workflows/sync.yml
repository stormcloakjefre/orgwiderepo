name: Sync CLAUDE.md to Repos

on:
  push:
    branches:
      - main

jobs:
  update-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run File Sync
        uses: BetaHuhn/repo-file-sync-action@v1
        with:
          config_file: .github/sync.yml
        env:
          GH_PAT: ${{ secrets.MY_GITHUB_PAT }}
